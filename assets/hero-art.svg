<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Line drawing: a building under construction, drawing sheets flowing into it, and tagged quantities flowing into a bill of quantities">
<style>
.l,.slab,.col,.colin,.mull,.win,.door,.unit,.crane,.lattice,.cw,.cable,.beam,.dim,.gg,.hatch,.thin{fill:none;stroke:#1a1a1a;stroke-linecap:round;stroke-linejoin:round}
.l{stroke-opacity:.38;stroke-width:1.1}
.slab{stroke-opacity:.30;stroke-width:1;fill:#fafaf7;fill-opacity:.35}
.col{stroke-opacity:.42;stroke-width:1.3}.colin{stroke-opacity:.16;stroke-width:1}
.mull{stroke-opacity:.16;stroke-width:.8}.win{stroke-opacity:.24;stroke-width:.8}
.door{stroke:#3F63D5;stroke-opacity:.6;stroke-width:1.2}
.unit{stroke-opacity:.45;stroke-width:1;fill:#fafaf7}
.crane{stroke-opacity:.42;stroke-width:1.2}.lattice{stroke-opacity:.2;stroke-width:.8}
.cw{stroke-opacity:.45;fill:#1a1a1a;fill-opacity:.06}
.cable{stroke-opacity:.4;stroke-width:.8}.beam{stroke-opacity:.5;fill:#FFDD64;fill-opacity:.5}
.dim{stroke:#3F63D5;stroke-opacity:.45;stroke-width:.9}
.dimt{font:500 11px 'JetBrains Mono',ui-monospace,monospace;fill:#3F63D5;fill-opacity:.7}
.gg{stroke-opacity:.06;stroke-width:1}.hatch{stroke-opacity:.08;stroke-width:1}
.thin{stroke-opacity:.28;stroke-width:.8}
.paper{fill:#fff;stroke:#1a1a1a;stroke-opacity:.3;stroke-width:1}
.sheett{font:500 8.5px 'JetBrains Mono',ui-monospace,monospace;fill:#1a1a1a;fill-opacity:.55}
.hl{fill:#FFDD64;fill-opacity:.55}.hlq{fill:#3F63D5;fill-opacity:.14}
.flow,.flow2{fill:none;stroke:#3F63D5;stroke-width:1.1;stroke-opacity:.5;stroke-dasharray:3 6;animation:dash 2.4s linear infinite}
.flow2{stroke:#E9C23A;stroke-opacity:.8}
.f1{animation-delay:-.6s}.f2{animation-delay:-1.2s}.f3{animation-delay:-1.8s}
@keyframes dash{to{stroke-dashoffset:-36}}
.halo{fill:#FFDD64;fill-opacity:.35;transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite;animation-delay:var(--d)}
.dot{fill:#FFDD64;stroke:#1a1a1a;stroke-width:1.2}
.q .dot{fill:#fff;stroke:#3F63D5;stroke-width:1.6}.q .halo{fill:#3F63D5;fill-opacity:.18}
.tag rect{fill:#fff;stroke:#1a1a1a;stroke-opacity:.18}
.tagl{font:500 9.5px 'JetBrains Mono',ui-monospace,monospace;fill:#1a1a1a;fill-opacity:.6}
.tagv{font:600 10.5px 'JetBrains Mono',ui-monospace,monospace;fill:#1a1a1a}
.q .tagv{fill:#3F63D5}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.9);opacity:0}}
.swing{transform-box:view-box;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-6px)}to{transform:translateX(8px)}}
.sheets{animation:float 9s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
